name: Pipeline Run Check

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/pipeline-run-check.yaml"
      - "pyproject.toml"
      - "src/cfa/stf/routine/**"
      - "tests/**"
      - "stfroutineforecasting/**"
      - "uv.lock"
  push:
    branches: [main]
    paths:
      - ".github/workflows/pipeline-run-check.yaml"
      - "pyproject.toml"
      - "src/cfa/stf/routine/**"
      - "tests/**"
      - "stfroutineforecasting/**"
      - "uv.lock"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  pipeline-e2e:
    name: Reduced pipeline end-to-end test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up routine forecasting Python
        uses: ./.github/actions/setup-routine-forecasting-python

      - name: Set up routine forecasting R
        uses: ./.github/actions/setup-routine-forecasting-r

      - name: Set up routine forecasting Julia
        uses: ./.github/actions/setup-routine-forecasting-julia

      - name: Run reduced pipeline end-to-end test
        run: >-
          uv run pytest -s
          -m pipeline_e2e
          tests/integration/test_pipeline_end_to_end.py
          --e2e-data-mode mock

  fable:
    name: Fable model test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up routine forecasting Python
        uses: ./.github/actions/setup-routine-forecasting-python

      - name: Set up routine forecasting R
        uses: ./.github/actions/setup-routine-forecasting-r

      - name: Run Fable model test
        run: >-
          uv run pytest -s
          tests/integration/test_fable_forecast.py
          --e2e-data-mode mock
          --model-test-location CA
          --model-test-disease covid

  pyrenew:
    name: PyRenew H/E/HE model test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up routine forecasting Python
        uses: ./.github/actions/setup-routine-forecasting-python

      - name: Set up routine forecasting R
        uses: ./.github/actions/setup-routine-forecasting-r

      - name: Run PyRenew model test
        run: >-
          uv run pytest -s
          tests/integration/test_pyrenew_forecast.py
          --e2e-data-mode mock
          --model-test-location CA
          --model-test-disease covid

  epiautogp:
    name: EpiAutoGP model test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up routine forecasting Python
        uses: ./.github/actions/setup-routine-forecasting-python

      - name: Set up routine forecasting R
        uses: ./.github/actions/setup-routine-forecasting-r

      - name: Set up routine forecasting Julia
        uses: ./.github/actions/setup-routine-forecasting-julia

      - name: Run EpiAutoGP model test
        run: >-
          uv run pytest -s
          tests/integration/test_epiautogp_forecast.py
          --e2e-data-mode mock
          --model-test-location CA
          --model-test-disease covid
