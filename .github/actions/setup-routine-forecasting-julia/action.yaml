name: "Set up routine forecasting Julia"
description: "Set up Julia and instantiate the NowcastAutoGP project."
inputs: {}
runs:
  using: "composite"
  steps:
    - name: Set up Julia
      uses: julia-actions/setup-julia@v3
      with:
        version: "1.13"

    - name: Cache Julia packages
      uses: julia-actions/cache@v3

    - name: Install Julia dependencies
      run: julia --project=src/cfa/stf/routine/nowcastautogp -e 'using Pkg; Pkg.instantiate()'
      shell: bash

    - name: Install mech_nssp_daily Julia dependencies
      run: julia --project=src/cfa/stf/routine/mech_nssp_daily -e 'using Pkg; Pkg.instantiate()'
      shell: bash
